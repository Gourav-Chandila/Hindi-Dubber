name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out server URL
        # Priority: HINDIDUB_SERVER_URL variable > URL derived from HF_SPACE variable.
        run: |
          URL="${{ vars.HINDIDUB_SERVER_URL }}"
          SPACE="${{ vars.HF_SPACE }}"
          if [ -z "$URL" ] && [ -n "$SPACE" ]; then
            URL="https://$(echo "$SPACE" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#; s#[_.]#-#g').hf.space"
          fi
          echo "Server URL baked into APK: ${URL:-<placeholder - set in app settings>}"
          echo "HINDIDUB_SERVER_URL=$URL" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: release APK will be signed with a debug key."
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/HindiDub-${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/HindiDub-${VERSION_NAME}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: HindiDub-apk
          path: android/out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          generate_release_notes: true
